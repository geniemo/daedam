<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-bg);font-family:var(--font-sans);color:var(--color-ink);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-card);border:1px solid var(--color-line)}
.nm{font-size:11px;color:var(--color-muted)}.hx{font-size:10.5px;color:var(--color-faint);font-variant-numeric:tabular-nums}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-ink)"></div><div class="nm">--color-ink</div><div class="hx">#16233A</div></div><div class="sw"><div class="chip" style="background:var(--color-body)"></div><div class="nm">--color-body</div><div class="hx">#2A3A55</div></div><div class="sw"><div class="chip" style="background:var(--color-body-2)"></div><div class="nm">--color-body-2</div><div class="hx">#3E4C63</div></div><div class="sw"><div class="chip" style="background:var(--color-muted)"></div><div class="nm">--color-muted</div><div class="hx">#5F6B7E</div></div><div class="sw"><div class="chip" style="background:var(--color-faint)"></div><div class="nm">--color-faint</div><div class="hx">#8E98A8</div></div><div class="sw"><div class="chip" style="background:var(--color-faintest)"></div><div class="nm">--color-faintest</div><div class="hx">#B7C0CD</div></div></div></body></html>
