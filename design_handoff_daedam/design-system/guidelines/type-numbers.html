<!-- @dsCard group="Type" viewport="700x150" subtitle="숫자는 항상 tabular-nums. 단위는 작고 흐리게 옆에" name="Numbers" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-bg);font-family:var(--font-sans);color:var(--color-ink);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-card);border:1px solid var(--color-line)}
.nm{font-size:11px;color:var(--color-muted)}.hx{font-size:10.5px;color:var(--color-faint);font-variant-numeric:tabular-nums}
</style></head><body><div style="display:flex;gap:34px;align-items:flex-end">
<div><div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:52px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums">80</span><span style="font-size:15px;color:var(--color-faint)">/ 100</span></div><div style="font-size:11px;color:var(--color-faint);margin-top:6px">hero · 52</div></div>
<div><div style="display:flex;align-items:baseline;gap:3px"><span style="font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums">74</span><span style="font-size:12px;color:var(--color-faint)">점</span></div><div style="font-size:11px;color:var(--color-faint);margin-top:6px">card score · 28</div></div>
<div><div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:23px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums">312</span><span style="font-size:12px;color:var(--color-faint)">음절/분</span></div><div style="font-size:11px;color:var(--color-faint);margin-top:6px">metric · 23</div></div>
<div><div style="font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums">62%</div><div style="font-size:11px;color:var(--color-faint);margin-top:6px">progress · 22</div></div>
<div><div style="font-size:13px;color:var(--stage-ink-warm);background:var(--stage-bg);padding:6px 10px;border-radius:3px;font-variant-numeric:tabular-nums">12:40</div><div style="font-size:11px;color:var(--color-faint);margin-top:6px">clock · 13</div></div>
</div></body></html>
