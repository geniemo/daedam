<!-- @dsCard group="Brand" viewport="700x190" subtitle="fade .3s(↑6px) · grow .7s · breathe 6s · wave 1.1s · slide 1.6s · 문턱→무대 확장 .45s. 진폭은 ref→style" name="Motion" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--stage-bg);font-family:var(--font-sans);color:var(--stage-ink-warm);-webkit-font-smoothing:antialiased;min-height:158px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.12)}
.nm{font-size:11px;color:var(--stage-ink-warm)}.hx{font-size:10.5px;color:var(--stage-dim);font-variant-numeric:tabular-nums}
</style></head><body><div style="display:flex;gap:34px;align-items:center;padding:8px 0">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="position:relative;width:56px;height:56px"><div style="position:absolute;inset:0;border-radius:50%;background:var(--gradient-sphere);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -8px 14px rgba(0,0,0,.42);animation:dm-breathe 6s ease-in-out infinite"></div><div style="position:absolute;inset:0;border-radius:50%;background:var(--gradient-voice-amber);opacity:.85"></div></div><span class="hx">breathe 6s</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="display:flex;gap:3px;height:38px;align-items:center"><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.09s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.21s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.05s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.33s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.14s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.27s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.02s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.19s"></div><div style="width:3px;height:38px;background:var(--stage-sand);transform-origin:center;animation:dm-wave 1.1s ease-in-out infinite;animation-delay:0.36s"></div></div><span class="hx">wave</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:13px;height:13px;border-radius:50%;border:1.5px solid var(--stage-amber);border-top-color:transparent;animation:dm-spin 1s linear infinite"></div><span class="hx">spin</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:140px;height:2px;background:rgba(255,255,255,.08);overflow:hidden"><div style="width:25%;height:100%;background:var(--stage-amber);animation:dm-slide 1.6s ease-in-out infinite"></div></div><span class="hx">slide (불확정)</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:140px;height:6px;background:rgba(255,255,255,.08)"><div style="width:78%;height:100%;background:var(--stage-paper);animation:dm-grow .7s ease"></div></div><span class="hx">grow (점수 바)</span></div>
</div><div class="hx" style="margin-top:10px">문턱→무대: 준비 완료의 어두운 띠가 제자리에서 화면 전체로 커진다 — left/top/width/height .45s cubic-bezier(.2,.7,.2,1). 그 외 화면 자체 페이드 없음. 질문 바뀜 dm-fade .6s. 색 전환(앰버↔민트) 1.4s.</div></body></html>
