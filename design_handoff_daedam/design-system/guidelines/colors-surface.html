<!-- @dsCard group="Colors" viewport="700x230" subtitle="따뜻한 종이 바탕 3면과 구분선 8단계. 카드에는 옅은 잉크 그림자 하나" name="Surfaces & rules" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-bg);font-family:var(--font-sans);color:var(--color-ink);-webkit-font-smoothing:antialiased;min-height:198px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-card);border:1px solid var(--color-line)}
.nm{font-size:11px;color:var(--color-muted)}.hx{font-size:10.5px;color:var(--color-faint);font-variant-numeric:tabular-nums}
</style></head><body><div class="row" style="margin-bottom:14px"><div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="nm">--color-bg</div><div class="hx">#F5F3EF</div></div><div class="sw"><div class="chip" style="background:var(--color-surface)"></div><div class="nm">--color-surface</div><div class="hx">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--color-surface-2)"></div><div class="nm">--color-surface-2</div><div class="hx">#FAF8F4</div></div><div class="sw"><div class="chip" style="background:var(--color-surface);box-shadow:var(--shadow-card);border-color:var(--color-line)"></div><div class="nm">--shadow-card</div><div class="hx">0 1px 2px .05 · 0 6px 20px -14px .12</div></div></div>
<div class="row"><div class="sw"><div class="chip" style="background:var(--color-hair)"></div><div class="nm">--color-hair</div><div class="hx">#F0EDE7</div></div><div class="sw"><div class="chip" style="background:var(--color-hair-2)"></div><div class="nm">--color-hair-2</div><div class="hx">#ECE8E1</div></div><div class="sw"><div class="chip" style="background:var(--color-hair-3)"></div><div class="nm">--color-hair-3</div><div class="hx">#F3F0EA</div></div><div class="sw"><div class="chip" style="background:var(--color-line)"></div><div class="nm">--color-line</div><div class="hx">#E3DFD7</div></div><div class="sw"><div class="chip" style="background:var(--color-line-2)"></div><div class="nm">--color-line-2</div><div class="hx">#E9E5DE</div></div><div class="sw"><div class="chip" style="background:var(--color-line-3)"></div><div class="nm">--color-line-3</div><div class="hx">#EBE7E0</div></div><div class="sw"><div class="chip" style="background:var(--color-field)"></div><div class="nm">--color-field</div><div class="hx">#CBC6BC</div></div><div class="sw"><div class="chip" style="background:var(--color-field-2)"></div><div class="nm">--color-field-2</div><div class="hx">#D9D4CB</div></div></div></body></html>
