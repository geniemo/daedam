<!-- @dsCard group="Spacing" viewport="700x170" subtitle="4 / 3 / 2. 원 외에는 이보다 둥글지 않다. 그림자 없음" name="Radius & borders" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-bg);font-family:var(--font-sans);color:var(--color-ink);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-card);border:1px solid var(--color-line)}
.nm{font-size:11px;color:var(--color-muted)}.hx{font-size:10.5px;color:var(--color-faint);font-variant-numeric:tabular-nums}
</style></head><body><div style="display:flex;gap:18px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:120px;height:72px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-card)"></div><span style="font-size:11px;color:var(--color-muted)">card · 4px · 1px line</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:120px;height:40px;background:var(--color-ink);border-radius:var(--radius-control);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">버튼 · 3px</div><span style="font-size:11px;color:var(--color-muted)">control · 3px</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:120px;height:40px;background:var(--color-surface);border:1px solid var(--color-field);border-radius:var(--radius-control);padding:0 12px;display:flex;align-items:center;font-size:13px;color:var(--color-faint)">입력 · 3px</div><span style="font-size:11px;color:var(--color-muted)">input · 3px · 1px field</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="display:flex;gap:6px"><span style="font-size:11.5px;color:var(--color-muted);border:1px solid var(--color-line-2);background:var(--color-surface-2);border-radius:var(--radius-chip);padding:4px 9px">두괄식</span><span style="font-size:11px;font-weight:600;color:var(--color-accent);background:var(--color-accent-bg);border:1px solid var(--color-accent-line);border-radius:var(--radius-chip);padding:3px 8px">사실과 다름</span></div><span style="font-size:11px;color:var(--color-muted)">chip · 2px</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="display:flex;gap:8px;align-items:center"><span style="width:30px;height:30px;border-radius:50%;border:1px solid var(--color-field);background:var(--color-surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--color-muted)">서</span><span style="width:5px;height:5px;border-radius:50%;background:var(--color-accent)"></span></div><span style="font-size:11px;color:var(--color-muted)">circles only</span></div>
</div></body></html>
