<!-- @dsCard group="Colors" viewport="700x150" subtitle="앰버는 "봐야 할 것"에만. 초록은 범위 안·연결됨. 지원자의 목소리는 초록. 무대의 앰버·민트와 같은 색상 계열" name="Accent & semantic" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-bg);font-family:var(--font-sans);color:var(--color-ink);-webkit-font-smoothing:antialiased;min-height:118px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-card);border:1px solid var(--color-line)}
.nm{font-size:11px;color:var(--color-muted)}.hx{font-size:10.5px;color:var(--color-faint);font-variant-numeric:tabular-nums}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="nm">--color-accent</div><div class="hx">#B8802E</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-bg)"></div><div class="nm">--color-accent-bg</div><div class="hx">#F8F0E3</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-bg-2)"></div><div class="nm">--color-accent-bg-2</div><div class="hx">#FBF6EE</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-line)"></div><div class="nm">--color-accent-line</div><div class="hx">#EADCC4</div></div><div class="sw"><div class="chip" style="background:var(--color-positive)"></div><div class="nm">--color-positive</div><div class="hx">#3A7A68</div></div><div class="sw"><div class="chip" style="background:var(--color-listening)"></div><div class="nm">--color-listening</div><div class="hx">#5AA48D</div></div></div></body></html>
