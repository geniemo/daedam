<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<script>Babel.registerPreset('classic',{presets:[[Babel.availablePresets.react,{runtime:'classic'}]]});</script>

<body><div id="root"></div>
<script>
// Loads the design-system component sources without a bundler: synchronous fetch, strip ESM
// import/export, classic-runtime JSX (React.createElement). Each file registers on window.Daedam.
(function(){
  var root='../../', files=["components/core/Card.jsx","components/core/PrimaryButton.jsx","components/core/OutlineButton.jsx","components/core/TextField.jsx","components/core/TextArea.jsx","components/core/Label.jsx","components/core/SectionLabel.jsx","components/core/Chip.jsx","components/core/ProgressBar.jsx","components/core/IndeterminateBar.jsx","components/core/Dots.jsx","components/core/Caret.jsx","components/navigation/Chrome.jsx","components/stage/Avatar.jsx","components/stage/Waveform.jsx"];
  files.forEach(function(p){
    var x=new XMLHttpRequest();x.open('GET',root+p,false);x.send(null);
    if(x.status>=400){console.warn('missing',p);return;}
    var src=x.responseText.replace(/^import[^\n]*\n/gm,'').replace(/^export (const|let|function|class) /gm,'$1 ');
    var out=Babel.transform(src,{presets:['classic'],filename:p}).code;
    (0,eval)(out);
  });
})();
</script>
