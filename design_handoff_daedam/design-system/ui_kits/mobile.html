<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>대담 — 모바일 미리 보기</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#E8E4DC;font-family:var(--font-sans);color:var(--color-ink);-webkit-font-smoothing:antialiased;padding:28px 24px}

<div class="row">

<div class="ph"><span>랜딩</span><iframe src="web/landing.html?w=390"></iframe></div>
