<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대담</title>
    <meta name="description" content="AI 면접관과 음성으로 미리 연습하세요." />
    <!-- 링크 미리보기(카카오톡·슬랙·문자). 이미지는 public/og.png(1200×630) — 절대 주소여야 한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="대담" />
    <meta property="og:title" content="대담 — AI 음성 모의면접" />
    <meta property="og:description" content="AI 면접관과 음성으로 미리 연습하세요." />
    <meta property="og:url" content="https://daedam.app/" />
    <meta property="og:image" content="https://daedam.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="대담 — AI 음성 모의면접" />
    <meta name="twitter:description" content="AI 면접관과 음성으로 미리 연습하세요." />
    <meta name="twitter:image" content="https://daedam.app/og.png" />
    <!-- 탭·홈 화면 아이콘. 심볼 C3(design-system/assets/logo). SVG를 못 쓰는
         브라우저(사파리·iOS)는 PNG로 떨어진다. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5f3ef" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
